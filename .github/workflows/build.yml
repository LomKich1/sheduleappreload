name: Build & Release

# Запускается при каждом пуше в main/master и вручную через Actions → Run workflow
on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Нужно для создания/обновления GitHub Release
permissions:
  contents: write

jobs:
  build-android:
    name: 🤖 Build Android APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Получаем код ───────────────────────────────────────────────────
      - uses: actions/checkout@v4

      # ── 2. JDK 17 (требуется AGP 8.x) ────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. Gradle 8.9 (без gradlew в репозитории) ─────────────────────────
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      # ── 4. Принимаем лицензии Android SDK ────────────────────────────────
      - name: Accept Android SDK licenses
        run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # ── 5. Debug APK (всегда, без секретов) ──────────────────────────────
      - name: Build Debug APK
        run: gradle assembleDebug --no-build-cache --rerun-tasks

      # ── 6. Signed Release APK (если keystore настроен) ───────────────────
      # Три секрета в Settings → Secrets → Actions:
      #   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
      - name: Build signed Release APK
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "🔑 Keystore найден — собираем Release APK"
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            gradle assembleRelease \
              -PKEYSTORE_PATH="$RUNNER_TEMP/release.jks" \
              -PKEYSTORE_PASSWORD="${{ secrets.KEYSTORE_PASSWORD }}" \
              -PKEY_ALIAS="${{ secrets.KEY_ALIAS }}" \
              -PKEY_PASSWORD="${{ secrets.KEY_PASSWORD }}"
            echo "HAS_RELEASE=true" >> "$GITHUB_ENV"
          else
            echo "ℹ️  Keystore не настроен — Release APK пропускаем"
          fi

      # ── 7. Читаем версию из gradle.properties ─────────────────────────────
      - name: Read version
        id: ver
        run: |
          V=$(grep '^APP_VERSION=' gradle.properties | cut -d= -f2 | tr -d ' \r\n')
          echo "v=${V:-1.0.0}" >> "$GITHUB_OUTPUT"
          echo "Версия: ${V:-1.0.0}"

      # ── 8. Копируем APK в единую папку dist/ ──────────────────────────────
      - name: Collect APKs
        run: |
          V="${{ steps.ver.outputs.v }}"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk \
             "dist/ScheduleApp-v${V}-debug.apk"
          if [ "$HAS_RELEASE" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk \
               "dist/ScheduleApp-v${V}.apk"
          fi
          echo "Файлы:"
          ls -lh dist/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apk-dist
          path: dist/*.apk
          if-no-files-found: error

    outputs:
      app-version: ${{ steps.ver.outputs.v }}

  build-desktop:
    name: 🖥️ Build Desktop (${{ matrix.os }})
    needs: build-android   # чтобы переиспользовать общую версию из шага выше
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            task: packageMsi
            artifact-glob: desktopApp/build/compose/binaries/main/msi/*.msi
          - os: ubuntu-latest
            task: packageDeb
            artifact-glob: desktopApp/build/compose/binaries/main/deb/*.deb
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      # ВАЖНО: packageVersion для десктопа = APP_VERSION + номер CI-рана
      # (например 1.0.1 -> 1.0.1.42). Это отдельно от Android versionName.
      # Причина: Windows Installer не поставит MSI поверх уже установленной
      # копии с ТЕМ ЖЕ ProductVersion — нужно чтобы версия росла на каждой
      # пересборке, иначе "пакет недействителен" при повторной установке
      # той же версии 1.0.1. upgradeUuid зафиксирован отдельно в
      # desktopApp/build.gradle, это решает узнавание "тот же продукт",
      # а растущая версия — что это именно апдейт, а не даунгрейд.
      - name: Build desktop package
        run: gradle :desktopApp:${{ matrix.task }} -PAPP_VERSION="${{ needs.build-android.outputs.app-version }}.${{ github.run_number }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: ${{ matrix.artifact-glob }}
          if-no-files-found: error

  publish:
    name: 📦 Publish Release
    needs: [build-android, build-desktop]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-all

      - name: Flatten dist folder
        run: |
          mkdir -p dist
          find dist-all -type f \( -name "*.apk" -o -name "*.msi" -o -name "*.deb" \) -exec cp {} dist/ \;
          echo "Итоговые файлы релиза:"
          ls -lh dist/

      - name: Delete previous release
        run: |
          gh release delete latest --yes 2>/dev/null || true
          git push origin --delete latest 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "ScheduleApp v${{ needs.build-android.outputs.app-version }}"
          body: |
            **Автосборка** · ветка `${{ github.ref_name }}` · коммит `${{ github.sha }}`

            ## 📥 Установка

            **Android:** скачай `.apk`, разреши "Неизвестные источники", установи.
            **Windows:** скачай `.msi`, запусти — ставится и обновляется поверх старой версии автоматически.
            **Linux (deb-based):** `sudo dpkg -i ScheduleApp-*.deb`

            | Файл | Платформа |
            |------|-----------|
            | `...-debug.apk` | Android, тестовый (debug-ключ) |
            | `...apk` (без суффикса) | Android, релиз (подписан, только если настроен keystore) |
            | `...msi` | Windows |
            | `...deb` | Linux (Debian/Ubuntu) |
          files: dist/*
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

