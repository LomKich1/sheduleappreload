name: Build & Release

# Запускается при каждом пуше в main/master и вручную через Actions → Run workflow
on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Нужно для создания/обновления GitHub Release
permissions:
  contents: write

jobs:
  build-android:
    name: 🤖 Build Android APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Получаем код (полная история + теги — нужны для проверки
      #      версии и статистики релиза дальше по пайплайну) ────────────────
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Читаем версию из gradle.properties ──────────────────────────────
      - name: Read version
        id: ver
        run: |
          V=$(grep '^APP_VERSION=' gradle.properties | cut -d= -f2 | tr -d ' \r\n')
          V="${V:-1.0.0}"
          echo "v=$V" >> "$GITHUB_OUTPUT"
          echo "Версия: $V"

          # Версия для desktop-пакетов (Exe/Msi/Dmg) ДОЛЖНА иметь ровно 3
          # числовые части (MAJOR.MINOR.BUILD) — это требование самого
          # Compose-плагина, а не наша прихоть. APP_VERSION уже 3 части
          # ("1.0.1"), поэтому просто прицепить run_number сверху (получая
          # "1.0.1.143") нельзя — 4 части ломают сборку и Windows, и Linux/
          # macOS джобы разом, ещё на этапе конфигурации Gradle, до всякой
          # реальной компиляции. Берём только MAJOR.MINOR из APP_VERSION и
          # подставляем run_number как BUILD — растущий номер для MSI
          # upgrade-детекции сохраняется, но формат остаётся валидным.
          MAJOR_MINOR=$(echo "$V" | cut -d. -f1-2)
          echo "desktop-v=${MAJOR_MINOR}" >> "$GITHUB_OUTPUT"

      # ── 3. Тег релиза не должен уже существовать ───────────────────────────
      # Каждый релиз теперь — отдельный тег v{APP_VERSION}, а не один
      # перезаписываемый "latest". Если тег уже есть на GitHub — значит
      # APP_VERSION в gradle.properties забыли поднять перед мержем в main.
      # Падаем здесь, до сборки, вместо того чтобы молча затереть релиз
      # прошлой версии тем же содержимым.
      #
      # Актуально ТОЛЬКО для main/master — тегов там пока быть не должно.
      # На dev (и любой другой ветке) версия ещё "черновая", релиз не
      # создаётся вообще (см. publish-джоб ниже), поэтому и проверять
      # тут нечего — не мешаем тестовым прогонам собираться.
      - name: Check release tag is not taken
        if: github.ref_name == 'main' || github.ref_name == 'master'
        run: |
          TAG="v${{ steps.ver.outputs.v }}"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"; then
            echo "❌ Тег $TAG уже существует на GitHub."
            echo "   Подними APP_VERSION в gradle.properties перед мержем в main."
            exit 1
          fi
          echo "✅ Тег $TAG свободен, можно собирать релиз"

      # ── 4. JDK 17 (требуется AGP 8.x) ────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 5. Настройка Android SDK + автоакцепт лицензий ───────────────────
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      # ── 6. Gradle 8.9 (без gradlew в репозитории) ─────────────────────────
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      # ── 7. Debug APK (всегда, без секретов) ──────────────────────────────
      - name: Build Debug APK
        run: gradle assembleDebug --no-build-cache --rerun-tasks

      # ── 8. Signed Release APK (если keystore настроен) ───────────────────
      - name: Build signed Release APK
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "🔑 Keystore найден — собираем Release APK"
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            gradle assembleRelease \
              -PKEYSTORE_PATH="$RUNNER_TEMP/release.jks" \
              -PKEYSTORE_PASSWORD="${{ secrets.KEYSTORE_PASSWORD }}" \
              -PKEY_ALIAS="${{ secrets.KEY_ALIAS }}" \
              -PKEY_PASSWORD="${{ secrets.KEY_PASSWORD }}"
            echo "HAS_RELEASE=true" >> "$GITHUB_ENV"
          else
            echo "ℹ️  Keystore не настроен — Release APK пропускаем"
          fi

      # ── 9. Копируем APK в единую папку dist/ ──────────────────────────────
      - name: Collect APKs
        run: |
          V="${{ steps.ver.outputs.v }}"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk \
             "dist/ScheduleApp-v${V}-debug.apk"
          if [ "$HAS_RELEASE" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk \
               "dist/ScheduleApp-v${V}.apk"
          fi
          echo "Файлы:"
          ls -lh dist/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apk-dist
          path: dist/*.apk
          if-no-files-found: error

    outputs:
      app-version: ${{ steps.ver.outputs.v }}
      desktop-version: ${{ steps.ver.outputs.desktop-v }}

  build-desktop:
    name: 🖥️ Build Desktop (${{ matrix.os }})
    needs: build-android
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            task: packageMsi
            artifact-glob: desktopApp/build/compose/binaries/main/msi/*.msi
          - os: ubuntu-latest
            task: packageDeb
            artifact-glob: desktopApp/build/compose/binaries/main/deb/*.deb
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Build desktop package
        run: gradle :desktopApp:${{ matrix.task }} -PAPP_VERSION="${{ needs.build-android.outputs.desktop-version }}.${{ github.run_number }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: ${{ matrix.artifact-glob }}
          if-no-files-found: error

  publish:
    name: 📦 Publish Release
    needs: [build-android, build-desktop]
    runs-on: ubuntu-latest
    # Релиз создаётся ТОЛЬКО из main/master. На dev (и любой другой ветке,
    # например при тестовом workflow_dispatch --ref dev) сборка доходит
    # только до Artifacts в build-android/build-desktop — этот джоб целиком
    # пропускается, GitHub Release не создаётся и не трогается.
    if: github.ref_name == 'main' || github.ref_name == 'master'

    steps:
      # Полная история нужна, чтобы найти предыдущий релизный тег и
      # посчитать по нему статистику (файлы/строки/дни с прошлого релиза).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-all

      - name: Flatten dist folder
        run: |
          mkdir -p dist
          find dist-all -type f \( -name "*.apk" -o -name "*.msi" -o -name "*.deb" \) -exec cp {} dist/ \;
          echo "Итоговые файлы релиза:"
          ls -lh dist/

      # ── Статистика относительно предыдущего релизного тега ─────────────────
      # Ищем самый свежий уже существующий тег вида vX.Y.Z (кроме текущего —
      # его ещё нет, он появится только при публикации ниже) и считаем
      # git diff --shortstat + сколько дней прошло с его коммита.
      - name: Compute release stats
        id: stats
        run: |
          PREV_TAG=$(git tag --sort=-creatordate | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)

          if [ -z "$PREV_TAG" ]; then
            echo "ℹ️  Предыдущих релизных тегов нет — это первый версионный релиз"
            {
              echo "block<<STATS_EOF"
              echo "_Первый релиз с версионными тегами — сравнивать не с чем._"
              echo "STATS_EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Предыдущий тег: $PREV_TAG"

          SHORTSTAT=$(git diff --shortstat "$PREV_TAG" HEAD)
          FILES=$(echo "$SHORTSTAT" | grep -oE '[0-9]+ file' | grep -oE '[0-9]+' || echo 0)
          ADDS=$(echo "$SHORTSTAT" | grep -oE '[0-9]+ insertion' | grep -oE '[0-9]+' || echo 0)
          DELS=$(echo "$SHORTSTAT" | grep -oE '[0-9]+ deletion' | grep -oE '[0-9]+' || echo 0)
          COMMITS=$(git rev-list --count "$PREV_TAG"..HEAD)

          PREV_DATE=$(git log -1 --format=%ct "$PREV_TAG")
          NOW_DATE=$(date +%s)
          DAYS=$(( (NOW_DATE - PREV_DATE) / 86400 ))

          {
            echo "block<<STATS_EOF"
            echo "**📊 Статистика релиза**"
            echo '```'
            echo "Файлов изменено: $FILES | Добавлено строк: $ADDS | Удалено строк: $DELS"
            echo "Коммитов: $COMMITS | Дней с прошлого релиза: $DAYS"
            echo '```'
            echo "STATS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ needs.build-android.outputs.app-version }}"
          name: "ScheduleApp v${{ needs.build-android.outputs.app-version }}"
          generate_release_notes: true
          body: |
            ## 📥 Установка

            **Android:** скачай `.apk`, разреши "Неизвестные источники", установи.
            **Windows:** скачай `.msi`, запусти — ставится и обновляется поверх старой версии автоматически.
            **Linux (deb-based):** `sudo dpkg -i ScheduleApp-*.deb`

            | Файл | Платформа |
            |------|-----------|
            | `...-debug.apk` | Android, тестовый (debug-ключ) |
            | `...apk` (без суффикса) | Android, релиз (подписан, только если настроен keystore) |
            | `...msi` | Windows |
            | `...deb` | Linux (Debian/Ubuntu) |

            ---

            ${{ steps.stats.outputs.block }}
          files: dist/*
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
