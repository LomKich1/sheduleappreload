name: Build & Release

# Запускается при каждом пуше в main/master и вручную через Actions → Run workflow

on:
  push:
    branches: [main, master]

  workflow_dispatch:

# Нужно для создания/обновления GitHub Release
permissions:
  contents: write

jobs:
  build-android:
    name: 🤖 Build Android APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Получаем код ───────────────────────────────────────────────────
      - uses: actions/checkout@v4

      # ── 2. JDK 17 (требуется AGP 8.x) ────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. Настройка Android SDK + автоакцепт лицензий ───────────────────
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      # ── 4. Gradle 8.9 (без gradlew в репозитории) ─────────────────────────
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      # ── 5. Debug APK (всегда, без секретов) ──────────────────────────────
      - name: Build Debug APK
        run: gradle assembleDebug --no-build-cache --rerun-tasks

      # ── 6. Signed Release APK (если keystore настроен) ───────────────────
      - name: Build signed Release APK
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "🔑 Keystore найден — собираем Release APK"

            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"

            gradle assembleRelease \
              -PKEYSTORE_PATH="$RUNNER_TEMP/release.jks" \
              -PKEYSTORE_PASSWORD="${{ secrets.KEYSTORE_PASSWORD }}" \
              -PKEY_ALIAS="${{ secrets.KEY_ALIAS }}" \
              -PKEY_PASSWORD="${{ secrets.KEY_PASSWORD }}"

            echo "HAS_RELEASE=true" >> "$GITHUB_ENV"
          else
            echo "ℹ️ Keystore не настроен — Release APK пропускаем"
          fi

      # ── 7. Читаем версию из gradle.properties ─────────────────────────────
      - name: Read version
        id: ver
        run: |
          V=$(grep '^APP_VERSION=' gradle.properties | cut -d= -f2 | tr -d ' \r\n')
          V="${V:-1.0.0}"

          echo "v=$V" >> "$GITHUB_OUTPUT"
          echo "Версия: $V"

          # Версия для desktop-пакетов (Exe/Msi/Dmg) ДОЛЖНА иметь ровно 3
          # числовые части (MAJOR.MINOR.BUILD) — это требование самого
          # Compose-плагина, а не наша прихоть.
          #
          # APP_VERSION уже 3 части ("1.0.1"), поэтому просто прицепить
          # run_number сверху (получая "1.0.1.143") нельзя — 4 части ломают
          # сборку и Windows, и Linux/macOS джобы разом, ещё на этапе
          # конфигурации Gradle, до всякой реальной компиляции.
          #
          # Берём только MAJOR.MINOR из APP_VERSION и подставляем run_number
          # как BUILD — растущий номер для MSI upgrade-детекции сохраняется,
          # но формат остаётся валидным.
          MAJOR_MINOR=$(echo "$V" | cut -d. -f1-2)

          echo "desktop-v=${MAJOR_MINOR}" >> "$GITHUB_OUTPUT"

      # ── 8. Копируем APK в единую папку dist/ ──────────────────────────────
      - name: Collect APKs
        run: |
          V="${{ steps.ver.outputs.v }}"

          mkdir -p dist

          cp app/build/outputs/apk/debug/app-debug.apk \
            "dist/ScheduleApp-v${V}-debug.apk"

          if [ "$HAS_RELEASE" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk \
              "dist/ScheduleApp-v${V}.apk"
          fi

          echo "Файлы:"
          ls -lh dist/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apk-dist
          path: dist/*.apk
          if-no-files-found: error

    outputs:
      app-version: ${{ steps.ver.outputs.v }}
      desktop-version: ${{ steps.ver.outputs.desktop-v }}

  build-desktop:
    name: 🖥️ Build Desktop (${{ matrix.os }})
    needs: build-android

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            task: packageMsi
            artifact-glob: desktopApp/build/compose/binaries/main/msi/*.msi

          - os: ubuntu-latest
            task: packageDeb
            artifact-glob: desktopApp/build/compose/binaries/main/deb/*.deb

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Build desktop package
        run: |
          gradle :desktopApp:${{ matrix.task }} \
            -PAPP_VERSION="${{ needs.build-android.outputs.desktop-version }}.${{ github.run_number }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: ${{ matrix.artifact-glob }}
          if-no-files-found: error

  publish:
    name: 📦 Publish Release
    needs: [build-android, build-desktop]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-all

      - name: Flatten dist folder
        run: |
          mkdir -p dist

          find dist-all -type f \
            \( -name "*.apk" -o -name "*.msi" -o -name "*.deb" \) \
            -exec cp {} dist/ \;

          echo "Итоговые файлы релиза:"
          ls -lh dist/

      - name: Delete previous release
        run: |
          gh release delete latest --yes 2>/dev/null || true
          git push origin --delete latest 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "ScheduleApp v${{ needs.build-android.outputs.app-version }}"

          body: |
            # 📅 ScheduleApp v${{ needs.build-android.outputs.app-version }}

            > Удобное расписание колледжа для Android, Windows и Linux.

            ---

            ## ✨ Что нового

            Обновления и исправления текущей версии.

            ---

            ## 📥 Скачать

            ### 📱 Android

            **Для телефона или планшета на Android**

            Рекомендуется скачать:

            `ScheduleApp-v${{ needs.build-android.outputs.app-version }}.apk`

            Это основная релизная версия приложения.

            Если релизный APK недоступен, можно использовать:

            `ScheduleApp-v${{ needs.build-android.outputs.app-version }}-debug.apk`

            > ⚠️ Debug-версия предназначена в первую очередь для тестирования.

            **Установка:**
            1. Скачайте APK.
            2. Откройте скачанный файл.
            3. Если Android попросит разрешение на установку из неизвестного источника — разрешите его для браузера или файлового менеджера.
            4. Установите приложение.

            ---

            ### 🪟 Windows

            **Рекомендуемый вариант для Windows**

            Скачайте:

            `ScheduleApp-v${{ needs.build-android.outputs.app-version }}.msi`

            Запустите установщик и следуйте инструкциям.

            При установке новой версии приложение автоматически обновляется поверх предыдущей.

            ---

            ### 🐧 Linux

            **Debian / Ubuntu и другие deb-based системы**

            Скачайте:

            `ScheduleApp-v${{ needs.build-android.outputs.app-version }}.deb`

            Установить можно командой:

            ```bash
            sudo dpkg -i ScheduleApp-*.deb
            ```

            ---

            ## 📦 Файлы релиза

            | Файл | Платформа | Назначение |
            |---|---|---|
            | `.apk` | 📱 Android | Основная релизная версия |
            | `-debug.apk` | 📱 Android | Тестовая версия |
            | `.msi` | 🪟 Windows | Установщик Windows |
            | `.deb` | 🐧 Linux | Debian / Ubuntu |

            ---

            ## ℹ️ Информация о сборке

            <details>
            <summary>Показать техническую информацию</summary>

            **Ветка:** `${{ github.ref_name }}`

            **Commit:** `${{ github.sha }}`

            **Сборка:** GitHub Actions

            **Версия:** `${{ needs.build-android.outputs.app-version }}`

            </details>

            ---

            **ScheduleApp** — расписание колледжа без лишней возни.

          files: dist/*
          make_latest: true

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}