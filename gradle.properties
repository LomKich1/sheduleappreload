# ── Версия приложения — меняй только здесь ───────────────────────────────────
# Увеличь APP_VERSION_CODE на 1 при каждом релизе (Google Play требует).
# APP_VERSION — человекочитаемая строка (любой формат).
APP_VERSION=1.0.4
APP_VERSION_CODE=4

android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m

# Линковка iOS-фреймворка (linkReleaseFrameworkIosArm64) падала с
# OutOfMemoryError: Java heap space на GitHub-раннере macos-latest — LLVM-
# линковка K/N framework в Release-режиме куда прожорливее по памяти, чем
# Android/Desktop-сборки, которым старых 2048m хватало с запасом. Подняли
# общий Gradle-heap до 6144m — раннер macos-latest даёт заметно больше,
# так что запас есть. disableCompilerDaemon — чтобы K/N-компилятор работал
# внутри того же процесса (и с тем же -Xmx выше), а не в отдельном
# демоне со своим автоматически подобранным (и, как видно, недостаточным)
# лимитом памяти, который никак не связан с org.gradle.jvmargs.
kotlin.native.disableCompilerDaemon=true

# Compose предупреждает о Homebrew JDK при упаковке macOS-приложения. В CI
# используется Temurin, а флаг позволяет собрать DMG и на обычном Homebrew JDK.
compose.desktop.packaging.checkJdkVendor=false
