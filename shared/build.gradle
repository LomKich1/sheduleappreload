plugins {
    id 'org.jetbrains.kotlin.multiplatform'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.compose'
    id 'com.android.library'
}

kotlin {
    // Один UI и бизнес-логика для Android, macOS (JVM) и iOS.
    androidTarget {
        compilerOptions { jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11) }
    }
    jvm("desktop") {
        compilerOptions { jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11) }
    }
    iosArm64()
    iosSimulatorArm64()
    iosX64()

    targets.withType(org.jetbrains.kotlin.gradle.plugin.mpp.KotlinNativeTarget).configureEach {
        binaries.framework {
            baseName = "ScheduleShared"
            isStatic = true
        }
    }

    sourceSets {
        commonMain.dependencies {
            api(compose.runtime)
            api(compose.foundation)
            api(compose.material3)
            api(compose.materialIconsExtended)
            api(compose.components.resources)
            api(compose.components.uiToolingPreview)
            api(compose.ui)

            implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0"
            implementation "org.jetbrains.kotlinx:kotlinx-datetime:0.8.0-0.6.x-compat"
            implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0"
            implementation "io.ktor:ktor-client-core:3.5.1"

            api "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel:2.11.0"
            api "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0"
            api "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose:2.11.0"
            api "org.jetbrains.androidx.navigation:navigation-compose:2.10.0-rc01"

            // Haze 2.x — realtime blur (frosted-glass). Блюр вынесен в отдельный
            // модуль haze-blur; API: Modifier.hazeSource() на источнике и
            // Modifier.hazeBlur(input, style) на плашке поверх него.
            implementation "dev.chrisbanes.haze:haze:2.1.0"
            implementation "dev.chrisbanes.haze:haze-blur:2.1.0"

        }
        androidMain.dependencies {
            implementation "androidx.core:core-ktx:1.18.0"
            implementation "androidx.activity:activity-compose:1.13.0"
            implementation "io.ktor:ktor-client-okhttp:3.5.1"
        }
        desktopMain {
            dependencies {
                implementation(compose.desktop.common)
                implementation "org.jetbrains.kotlinx:kotlinx-coroutines-swing:1.11.0"
                implementation "io.ktor:ktor-client-okhttp:3.5.1"
            }
        }
        iosMain.dependencies {
            implementation "io.ktor:ktor-client-darwin:3.5.1"
        }
    }
}

android {
    namespace 'com.schedule.app.shared'
    compileSdk 36

    defaultConfig { minSdk 26 }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        buildConfig true   // нужно для BuildConfig.DEBUG в util/BuildInfo.kt (androidMain)
    }
}

// Пакет, в котором окажется сгенерированный класс Res (ic_camek и т.д.) —
// используется в AppHeader.kt как com.schedule.app.generated.Res
compose.resources {
    packageOfResClass = "com.schedule.app.generated"
    publicResClass = true
    generateResClass = always
}
