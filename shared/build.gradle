plugins {
    id 'org.jetbrains.kotlin.multiplatform'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.compose'
    id 'com.android.library'
}

kotlin {
    // Один UI и бизнес-логика для Android, macOS (JVM) и iOS.
    androidTarget {
        compilerOptions { jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11) }
    }
    jvm("desktop") {
        compilerOptions { jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11) }
    }
    iosArm64()
    iosSimulatorArm64()
    iosX64()

    targets.withType(org.jetbrains.kotlin.gradle.plugin.mpp.KotlinNativeTarget).configureEach {
        binaries.framework {
            baseName = "ScheduleShared"
            isStatic = true
        }
    }

    sourceSets {
        commonMain.dependencies {
            api(compose.runtime)
            api(compose.foundation)
            api(compose.material3)
            api(compose.materialIconsExtended)
            api(compose.components.resources)
            api(compose.components.uiToolingPreview)
            api(compose.ui)

            implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.9.0"
            implementation "org.jetbrains.kotlinx:kotlinx-datetime:0.6.2"
            implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.8.1"
            implementation "io.ktor:ktor-client-core:3.1.3"

            api "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel:2.9.4"
            api "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose:2.9.4"
            api "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose:2.9.4"
            // 2.9.2 publishes iOS klibs built with Kotlin 2.2.x; this project
            // remains on Kotlin 2.1.20, so use the compatible 2.9.0 KMP release.
            api "org.jetbrains.androidx.navigation:navigation-compose:2.9.0"

        }
        androidMain.dependencies {
            implementation "androidx.core:core-ktx:1.13.1"
            implementation "androidx.activity:activity-compose:1.9.0"
            implementation "io.ktor:ktor-client-okhttp:3.1.3"
        }
        desktopMain {
            dependencies {
                implementation(compose.desktop.common)
                implementation "org.jetbrains.kotlinx:kotlinx-coroutines-swing:1.9.0"
                implementation "io.ktor:ktor-client-okhttp:3.1.3"
            }
        }
        iosMain.dependencies {
            implementation "io.ktor:ktor-client-darwin:3.1.3"
        }
    }
}

android {
    namespace 'com.schedule.app.shared'
    compileSdk 35

    defaultConfig { minSdk 26 }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        buildConfig true   // нужно для BuildConfig.DEBUG в util/BuildInfo.kt (androidMain)
    }
}

// Пакет, в котором окажется сгенерированный класс Res (ic_camek и т.д.) —
// используется в AppHeader.kt как com.schedule.app.generated.Res
compose.resources {
    packageOfResClass = "com.schedule.app.generated"
    publicResClass = true
    generateResClass = always
}
